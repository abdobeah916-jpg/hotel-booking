name: Deploy hotel booking frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hotel-booking-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: hotel-booking-frontend
        run: npm ci
      - name: Build frontend
        working-directory: hotel-booking-frontend
        env:
          GITHUB_ACTIONS: true
        run: npm run build
      - name: SPA fallback
        run: cp hotel-booking-frontend/dist/index.html hotel-booking-frontend/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hotel-booking-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
